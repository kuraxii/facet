# 推 `v*` 标签时出两个平台的发行包：Linux 的 rpm / deb / tar.gz × x86_64 / arm64，
# Windows 的 x64 NSIS 安装包。
#
# 两个平台各用原生 runner 打自己那份：node-pty 是原生模块，x64 上交叉编 arm64 需要交叉工具链，
# 直接用 arm runner 走同一条 `npm ci` → `@electron/rebuild` 的路径更省事；Windows 也一样，
# 自带的 Node 运行时与 Electron 二进制都按 runner 的平台下载。
#
# 三条触发方式：
# - 推 `v*` 标签：发一个正式版本，产物挂到同名 GitHub Release 上；
# - 每天定时（本地 02:00）：拿 main 的当前提交出一份 **夜间预发布**（`nightly`，每晚覆盖同一份），
#   上一份指向的提交没变时整套跳过，不给同一棵树重复打三个平台的包；
# - 手动 dispatch：只验证流水线；`nightly` 输入为真时按夜间构建处理，用来核对这条路径。
#
# 产物既作为 workflow artifact 保留（标签 90 天、夜间 7 天），也挂到上面那两个发布里。

name: build

on:
  push:
    tags:
      - "v*"
  # 夜间构建：02:00（UTC+8）= 前一天 18:00 UTC，趁没人用的时候打
  schedule:
    - cron: "0 18 * * *"
  # 手动跑一次也能出包，用来验证流水线本身
  workflow_dispatch:
    inputs:
      nightly:
        description: 按夜间构建处理（建或更新 nightly 预发布）
        type: boolean
        default: false

# 建发布要写权限；其余 job 只用得上读
permissions:
  contents: read

# 同一版本重复推送时，先把上一轮停掉
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 关掉各组件的颜色与控制字符，日志在 Actions 里更好读
  NO_COLOR: "1"
  CI: "1"

jobs:
  # 门禁：与 PR 检查用的同一份可复用工作流，发包前先证明这棵树是好的
  gates:
    name: gates
    uses: ./.github/workflows/gates.yml

  # 先判断这次要不要打。夜间构建看一眼 main 有没有新提交：上一份 nightly 就指在同一个提交
  # 上时整套跳过；标签构建与手动构建不查，直接继续。
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # 本次是否按夜间构建处理（建或更新 nightly 预发布）
      nightly: ${{ steps.mode.outputs.nightly }}
      # 为真时后续 job 全部跳过
      skip: ${{ steps.mode.outputs.skip }}
    steps:
      - name: 判断这次要不要打
        id: mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 定时当然算夜间；手动 dispatch 只有勾了 `nightly` 才算。夜间那一路读的是
        # `nightly` 预发布当前指的提交——没有这个发布时按“要打”处理。
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.nightly }}" = "true" ]; then
            echo "nightly=true" >> "$GITHUB_OUTPUT"
          else
            echo "nightly=false" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq '.targetCommitish' 2>/dev/null || true)"
          echo "nightly 当前指向: ${current:-<还没有>}；本次提交: $GITHUB_SHA"
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "main 自上次夜间构建以来没有新提交，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: linux ${{ matrix.arch }}
    needs:
      - gates
      - preflight
    # 夜间构建碰上「没有新提交」时整套跳过（标签与手动构建的 skip 恒为 false）
    if: needs.preflight.outputs.skip != 'true'
    strategy:
      # 一个架构挂了不要把另一个也取消掉，两个都要看到结果
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # 打三个包 + 下载 Electron 与 Node 运行时，留足时间
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # 原生模块（node-pty、ssh2 的 crypto 绑定）由构建机现场编译，符号版本跟着构建机的
      # glibc 走；runner 本身是 2.39，产物装到 Ubuntu 20.04（2.31）上会直接起不来。所以
      # `npm ci` 放进 rockylinux:8（glibc 2.28）里跑，其余步骤留在 runner 上。
      # 打包也留在 runner：旧环境里 electron-builder 自带的 fpm 会用便携 Ruby 顶掉系统
      # OpenSSL，让 rpmbuild 起不来。
      - name: 原生模块在 glibc 2.28 的环境里编译
        run: |
          # setup-node 装的那份 Node 直接挂进容器，版本与架构自动一致
          NODE_ROOT="$(dirname "$(dirname "$(command -v node)")")"
          docker run --rm \
            -v "$PWD:/work" \
            -v "$NODE_ROOT:/opt/hostnode:ro" \
            -v "$HOME/.npm:/root/.npm" \
            -w /work \
            rockylinux/rockylinux:8 bash -euc '
              dnf install -y --setopt=install_weak_deps=False \
                gcc-toolset-11-gcc gcc-toolset-11-gcc-c++ make python3.11 openssl-devel libatomic git findutils xz tar
              source /opt/rh/gcc-toolset-11/enable
              export PATH=/opt/hostnode/bin:$PATH PYTHON=/usr/bin/python3.11
              node -v
              npm ci
            '
          # 容器里以 root 写的 node_modules 交回 runner 用户，后续步骤才写得动
          sudo chown -R "$(id -u):$(id -g)" node_modules

      # 先打 server 再让 electron-builder 动 node_modules：node-pty 是 N-API 模块，同一份
      # .node 在 Node 与 Electron 下都能加载，但顺序固定下来，将来换成 ABI 相关的原生模块
      # 时不会拷错那一份
      - name: 打独立的 server 产物
        run: npm run build:server
      - name: 构建桌面
        run: npm run build -w @facet/desktop

      - name: 出 rpm、deb 与 tar.gz
        working-directory: apps/desktop
        # --publish never：产物只留在本机，由下一步上传
        run: npx electron-builder --linux rpm deb tar.gz --${{ matrix.arch }} --publish never

      - name: 核对产物
        working-directory: apps/desktop
        # 归档名里的架构串随格式变（rpm 用 x86_64/aarch64、deb 用 amd64/arm64），
        # 所以按格式数个数，不拼文件名
        run: |
          ls -lh dist/*.rpm dist/*.deb dist/*.tar.gz
          for ext in rpm deb tar.gz; do
            count=$(ls -1 dist/*."$ext" 2>/dev/null | wc -l)
            if [ "$count" != "1" ]; then
              echo "dist 下应只有一个 .$ext，实际 $count 个"
              exit 1
            fi
          done
          echo "三个格式各出一份"

      # 上一步只证明包出得来了；这一步证明它能在目标机上跑：所有 ELF 的符号版本都不超过
      # Ubuntu 20.04 的 2.31
      - name: 核对 glibc 底线
        run: node scripts/check-glibc.mjs --max 2.31

      - uses: actions/upload-artifact@v4
        with:
          name: facet-linux-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.rpm
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.tar.gz
          # 六个包一次传完，任缺其一就当失败
          if-no-files-found: error
          # 夜间构建每天都传一次，只留一周；标签构建留 90 天
          retention-days: ${{ needs.preflight.outputs.nightly == 'true' && 7 || 90 }}

  # Windows 只出 x64 的 NSIS 安装包：arm64 要另一套 Electron 二进制与 win32-arm64 的 Node
  # 运行时，等有需求再补一台 arm64 runner
  windows:
    name: windows x64
    needs:
      - gates
      - preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: windows-latest
    # 自带 Node 运行时、Electron 与 NSIS 工具链都要下，压缩安装包本身也要几分钟
    timeout-minutes: 60
    env:
      # 不签名：runner 上没有证书，别让 electron-builder 去翻系统证书存储
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # 三处下载都不小：Electron 约 100 MB、自带 Node 运行时约 30 MB、NSIS/7zip 工具链约 50 MB。
      # 键跟着锁文件与 .node-version 走，版本一换自然失效
      - name: 缓存 Electron、Node 运行时与打包工具链
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\.cache\facet-node
            ~\AppData\Local\electron-builder\Cache
          key: windows-downloads-${{ hashFiles('package-lock.json', '.node-version') }}
          restore-keys: |
            windows-downloads-

      - run: npm ci

      # 顺序与 linux job 一致：先打 server 产物
      - name: 打独立的 server 产物
        run: npm run build:server
      - name: 构建桌面
        run: npm run build -w @facet/desktop

      - name: 核对 server 自带的 Node 运行时
        shell: pwsh
        # Windows 的运行时是 node.exe：产物按别的平台打出来时这里先失败，不必等安装包
        run: |
          $node = "apps/desktop/dist-server/bin/node.exe"
          if (-not (Test-Path $node)) {
            throw "缺少 $node：server 产物不是按 Windows 打的"
          }
          & $node --version

      - name: 出 NSIS 安装包
        working-directory: apps/desktop
        # --publish never：产物只留在本机，由下一步上传
        run: npx electron-builder --win --x64 --publish never

      - name: 核对产物
        working-directory: apps/desktop
        shell: pwsh
        # 安装包只有一个；体积异常小说明有文件没打进去
        run: |
          $setups = @(Get-ChildItem dist/*-setup.exe)
          if ($setups.Count -ne 1) {
            throw "dist 下应只有一个 *-setup.exe，实际 $($setups.Count) 个"
          }
          Get-ChildItem dist/* | ForEach-Object { "$($_.Name) $([math]::Round($_.Length / 1MB, 1)) MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: facet-windows-x64
          path: apps/desktop/dist/*-setup.exe
          if-no-files-found: error
          # 夜间构建每天都传一次，只留一周；标签构建留 90 天
          retention-days: ${{ needs.preflight.outputs.nightly == 'true' && 7 || 90 }}

  # 推标签时建同名正式发布；夜间构建改建（覆盖）那份 `nightly` 预发布。
  # 手动 dispatch 只在勾了 `nightly` 时才走夜间这一路。
  release:
    name: release
    needs:
      - preflight
      - linux
      - windows
    if: >-
      needs.preflight.outputs.skip != 'true' &&
      (startsWith(github.ref, 'refs/tags/v') || needs.preflight.outputs.nightly == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # 版本号来自仓库里的 package.json，与打标签前那次发版提交一致
      - uses: actions/checkout@v4
        with:
          # 夜间构建的说明要列「上次标签以来」的提交，得拿到完整历史与标签
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: facet-*
          # 三份 artifact 解到同一个目录，下面按扩展名取文件
          merge-multiple: true
          path: dist

      - name: 核对要发布的文件
        run: |
          ls -lh dist
          for ext in rpm deb tar.gz exe; do
            count=$(ls -1 dist/*."$ext" 2>/dev/null | wc -l)
            if [ "$count" -lt 1 ]; then
              echo "dist 下没有 .$ext"
              exit 1
            fi
          done

      - name: 建发布并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY: ${{ needs.preflight.outputs.nightly }}
        # 只挂六个 Linux 包与 Windows 安装包；blockmap 与 latest.yml 是自动更新用的，
        # 应用里没有更新功能，不往 Release 上放。
        #
        # 两个分支：
        # - 标签构建：同名正式发布，`--generate-notes` 自动写变更；
        # - 夜间构建：同一个 `nightly` 标签与预发布每晚 **覆盖** 一份，旧的连 tag 一起删掉，
        #   所以不会越攒越多；`--prerelease --latest=false` 保证它永远不抢 Latest，
        #   `--target $GITHUB_SHA` 让「上一份指在哪个提交」可直接查。
        run: |
          files=(dist/*.rpm dist/*.deb dist/*.tar.gz dist/*-setup.exe)
          if [ "$NIGHTLY" != "true" ]; then
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "facet ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              --verify-tag
            exit 0
          fi
          tag=nightly
          gh release delete "$tag" --yes --cleanup-tag >/dev/null 2>&1 || true
          {
            echo "main 上的夜间构建：每晚覆盖同一份预发布，安装包未经完整验证，稳定版看带版本号的发布。"
            echo
            echo "- 提交：\`${GITHUB_SHA}\`"
            echo "- 构建时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            last="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
            if [ -n "$last" ]; then
              echo
              echo "\`$last\` 以来合并进 main 的提交："
              echo
              echo '```'
              git log --no-merges --pretty='%h %s' "$last..HEAD" | head -n 30
              echo '```'
            fi
          } > nightly-notes.md
          gh release create "$tag" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "facet nightly ($(date -u '+%Y-%m-%d'))" \
            --notes-file nightly-notes.md \
            --prerelease \
            --latest=false
