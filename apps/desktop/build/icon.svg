<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 钴蓝柔和外发光 -->
    <filter id="cobalt-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- 细腻暗色背景渐变 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D26" />
      <stop offset="100%" stop-color="#0F1117" />
    </linearGradient>
    <!-- 主线条轻微亮蓝渐变，增加立体感 -->
    <linearGradient id="stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- 圆角矩形底座 -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#bg-grad)" stroke="#252A38" stroke-width="2" />

  <!-- 辅助拓扑虚线（圆角过渡） -->
  <path d="M 164 68 L 164 114 Q 164 128 152 138 L 108 188" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 7" opacity="0.32" />

  <!-- 字母 f 圆润主骨架 -->
  <g fill="none" stroke="url(#stroke-grad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <!-- 竖干与顶部圆弧弯折 -->
    <path d="M 108 188 L 108 100 Q 108 68 140 68 L 164 68" />
    <!-- 横杠与柔和上扬弧线 -->
    <path d="M 78 128 L 138 128 Q 152 128 164 112" />
  </g>

  <!-- 三个分布式终端空心圆环节点 -->
  <g fill="#141720" stroke="#3B82F6" stroke-width="7.5" filter="url(#cobalt-glow)">
    <!-- 1. 顶部远端节点 -->
    <circle cx="164" cy="68" r="13" />
    <!-- 2. 右侧通道节点 -->
    <circle cx="164" cy="112" r="13" />
    <!-- 3. 底部核心/本地节点 -->
    <circle cx="108" cy="188" r="13" />
  </g>
</svg>
